<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>清荷 - 账号切换</title>
<style>
:root {
  --pink: #f4a0b0;
  --pink-light: #fef0f4;
  --pink-deep: #e87a90;
  --ribbon: #e6003a;
  --ribbon-dark: #c4002e;
  --white: #fff;
  --text: #5d4e5d;
  --text-light: #9a8a9a;
  --green: #6bc490;
  --shadow: 0 2px 14px rgba(244,160,176,.2);
  --radius: 18px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(170deg, #fff5f7 0%, #fef0f4 35%, #fce4ec 100%);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  padding-bottom:60px;
  -webkit-tap-highlight-color:transparent;
  position:relative;
}
/* ---- bg paw prints ---- */
body::before {
  content:'';
  position:fixed; inset:0; pointer-events:none; z-index:0;
  opacity:.03;
  background:
    radial-gradient(circle at 10% 20%, #e6003a 1px,transparent 1px),
    radial-gradient(circle at 12% 25%, #e6003a 1.5px,transparent 1.5px),
    radial-gradient(circle at 13% 21%, #e6003a 1px,transparent 1px),
    radial-gradient(circle at 10% 26%, #e6003a 2px,transparent 2px),
    radial-gradient(circle at 85% 15%, #e6003a 1px,transparent 1px),
    radial-gradient(circle at 87% 20%, #e6003a 1.5px,transparent 1.5px),
    radial-gradient(circle at 88% 16%, #e6003a 1px,transparent 1px),
    radial-gradient(circle at 85% 21%, #e6003a 2px,transparent 2px),
    radial-gradient(circle at 25% 75%, #e6003a 1px,transparent 1px),
    radial-gradient(circle at 27% 80%, #e6003a 1.5px,transparent 1.5px),
    radial-gradient(circle at 28% 76%, #e6003a 1px,transparent 1px),
    radial-gradient(circle at 25% 81%, #e6003a 2px,transparent 2px),
    radial-gradient(circle at 70% 55%, #e6003a 1px,transparent 1px),
    radial-gradient(circle at 72% 60%, #e6003a 1.5px,transparent 1.5px),
    radial-gradient(circle at 73% 56%, #e6003a 1px,transparent 1px),
    radial-gradient(circle at 70% 61%, #e6003a 2px,transparent 2px);
  background-size:100% 100%;
}

/* ---- header ---- */
.header {
  background:linear-gradient(135deg, #fbb6c5 0%, #f4a0b0 50%, #f090a0 100%);
  padding:28px 24px 24px;
  text-align:center;
  position:relative;
  overflow:visible;
  z-index:1;
}
/* header ribbon border bottom */
.header::after {
  content:'';
  position:absolute; bottom:-12px; left:50%;
  transform:translateX(-50%);
  width:80%; height:24px;
  background:var(--ribbon);
  border-radius:0 0 20px 20px;
  z-index:-1;
}
.header::before {
  content:'';
  position:absolute; bottom:-12px; left:50%;
  transform:translateX(-50%);
  width:0; height:0;
  border-left:12px solid transparent;
  border-right:12px solid transparent;
  border-top:12px solid var(--ribbon-dark);
  z-index:0;
}

/* ---- HK bow ---- */
.bow-wrap {
  display:inline-block; position:relative;
  margin-bottom:8px;
}
.bow {
  display:inline-block;
  position:relative;
  width:36px; height:26px;
}
.bow-center {
  position:absolute;
  width:14px; height:14px;
  background:var(--ribbon);
  border-radius:50%;
  left:50%; top:50%;
  transform:translate(-50%,-50%);
  z-index:2;
}
.bow-left, .bow-right {
  position:absolute; top:2px;
  width:0; height:0;
  border-top:13px solid var(--ribbon);
  border-bottom:13px solid var(--ribbon);
}
.bow-left {
  left:0;
  border-left:15px solid transparent;
  border-right:10px solid var(--ribbon);
  border-radius:0 40% 40% 0;
}
.bow-right {
  right:0;
  border-right:15px solid transparent;
  border-left:10px solid var(--ribbon);
  border-radius:40% 0 0 40%;
}

.title {
  font-size:22px; font-weight:700; color:var(--white);
  letter-spacing:3px;
}
.subtitle {
  font-size:12px; color:rgba(255,255,255,.7);
  margin-top:4px;
  letter-spacing:1px;
}

/* ---- container ---- */
.container {
  max-width:420px; margin:0 auto;
  padding:24px 14px;
  position:relative; z-index:1;
}

/* ---- section title with ribbon ---- */
.section-title {
  font-size:13px; font-weight:700; color:var(--ribbon);
  margin-bottom:12px; padding-left:18px;
  position:relative;
  text-transform:uppercase; letter-spacing:2px;
}
.section-title::before {
  content:'';
  position:absolute; left:0; top:50%;
  transform:translateY(-50%);
  width:12px; height:12px;
  background:var(--ribbon);
  border-radius:3px 3px 10px 3px;
}
.section-title::after {
  content:'';
  position:absolute; left:0; bottom:-4px;
  width:40px; height:2px;
  background:linear-gradient(90deg, var(--ribbon), transparent);
  border-radius:1px;
}

/* ---- game cards ---- */
.game-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}
.game-card {
  background:var(--white);
  border-radius:var(--radius);
  padding:16px 10px;
  text-align:center;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:all .18s;
  border:2px solid transparent;
  position:relative;
}
.game-card:active { transform:scale(.95); box-shadow:0 1px 6px rgba(244,160,176,.15); }
.game-card.selected {
  border-color:var(--ribbon);
  box-shadow:0 0 0 3px rgba(230,0,58,.12), var(--shadow);
  background:linear-gradient(135deg, #fff, #fff5f7);
}
/* selected checkmark */
.game-card.selected::after {
  content:'';
  position:absolute; top:8px; right:8px;
  width:20px; height:20px;
  background:var(--ribbon);
  border-radius:50%;
}
.game-card.selected::before {
  content:'';
  position:absolute; top:12px; right:13px;
  width:5px; height:9px;
  border:solid var(--white);
  border-width:0 2px 2px 0;
  transform:rotate(45deg);
  z-index:1;
}
.game-icon {
  font-size:34px; margin-bottom:6px;
  display:block;
}
.game-name {
  font-size:13px; font-weight:700;
  color:var(--text);
}
.game-pkg {
  font-size:10px; color:var(--text-light);
  margin-top:3px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* ---- input ---- */
.manual-row {
  display:flex; gap:8px;
  margin-bottom:20px;
}
.input {
  flex:1;
  border:2px solid #f5e0e8;
  border-radius:14px;
  padding:11px 14px;
  font-size:14px; color:var(--text);
  background:var(--white);
  outline:none;
  transition:border-color .2s;
}
.input:focus { border-color:var(--pink-deep); }
.input::placeholder { color:#dcc; }

.btn {
  border:none;
  border-radius:14px;
  padding:10px 20px;
  font-size:14px; font-weight:600;
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
  letter-spacing:.5px;
}
.btn:active { opacity:.85; transform:scale(.96); }
.btn-primary {
  background:linear-gradient(135deg, var(--ribbon), var(--ribbon-dark));
  color:var(--white);
  box-shadow:0 3px 10px rgba(230,0,58,.2);
}
.btn-outline {
  background:var(--white);
  color:var(--ribbon);
  border:2px solid var(--ribbon);
}
.btn-green {
  background:linear-gradient(135deg, var(--green), #52a870);
  color:var(--white);
  box-shadow:0 3px 10px rgba(107,196,144,.2);
}
.btn-block { display:block; width:100%; text-align:center; }

/* ---- user tags ---- */
.user-tags {
  display:flex; gap:8px; flex-wrap:wrap;
  margin-bottom:16px;
}
.user-tag {
  padding:7px 16px;
  border-radius:22px;
  font-size:13px; font-weight:500;
  background:var(--white);
  border:2px solid #f5e0e8;
  cursor:pointer;
  transition:all .15s;
  letter-spacing:.5px;
}
.user-tag.selected {
  background:var(--pink-light);
  border-color:var(--ribbon);
  color:var(--ribbon);
  font-weight:700;
}

.remark-row {
  display:flex; gap:8px;
  margin-bottom:16px;
}

/* ---- backup list ---- */
.backup-list {
  display:flex; flex-direction:column;
  gap:8px;
}
.backup-item {
  background:var(--white);
  border-radius:14px;
  padding:14px 14px;
  box-shadow:var(--shadow);
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-left:5px solid var(--ribbon);
  transition:transform .15s;
}
.backup-item:active { transform:scale(.98); }
.backup-info {
  flex:1; min-width:0;
}
.backup-info .name {
  font-size:13px; font-weight:700;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.backup-info .meta {
  font-size:11px; color:var(--text-light);
  margin-top:2px;
}
.backup-item .restore-btn {
  flex-shrink:0;
  margin-left:12px;
  padding:7px 16px;
  font-size:12px;
}

/* ---- toast ---- */
.toast {
  position:fixed; top:20px; left:50%;
  transform:translateX(-50%);
  background:#5d4e5d;
  color:var(--white);
  padding:12px 28px;
  border-radius:24px;
  font-size:13px;
  z-index:999;
  opacity:0;
  transition:opacity .3s;
  pointer-events:none;
  max-width:90vw;
  text-align:center;
  font-weight:600; letter-spacing:.5px;
}
.toast.show { opacity:1; }
.toast.success { background:var(--green); }
.toast.error { background:#e06060; }

.empty {
  text-align:center; padding:36px 0;
  color:var(--text-light);
  font-size:14px;
}
.empty-icon { font-size:44px; margin-bottom:8px; display:block; }

/* ---- divider ---- */
.divider {
  height:1px;
  background:linear-gradient(90deg, transparent, #f5d8e0 20%, #f5d8e0 80%, transparent);
  margin:24px 0;
}

/* ---- spinner ---- */
.spinner {
  display:inline-block;
  width:16px; height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:var(--white);
  border-radius:50%;
  animation:spin .6s linear infinite;
  vertical-align:middle;
  margin-right:6px;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ---- footer decoration ---- */
.footer-deco {
  text-align:center;
  padding:32px 0 16px;
  position:relative;
}
.footer-deco::before {
  content:'';
  display:block;
  margin:0 auto 8px;
  width:60px; height:40px;
  background:
    radial-gradient(circle at 18px 8px, var(--ribbon) 6px, transparent 6px),
    radial-gradient(circle at 42px 8px, var(--ribbon) 6px, transparent 6px),
    radial-gradient(circle at 30px 22px, #fff 8px, transparent 8px);
  opacity:.4;
}
</style>
</head>
<body>

<div class="header">
  <div class="bow-wrap"><span class="bow"><i class="bow-left"></i><i class="bow-right"></i><i class="bow-center"></i></span></div>
  <div class="title">清 荷</div>
  <div class="subtitle">腾讯手游账号本地切换器</div>
</div>

<div class="container">

  <div class="section-title">选择游戏</div>
  <div class="game-grid" id="gameGrid"></div>

  <div class="manual-row">
    <input class="input" id="manualPkg" placeholder="或手动输入包名..." autocomplete="off">
    <button class="btn btn-outline" id="btnManualSelect">确定</button>
  </div>

  <div class="divider"></div>

  <div class="section-title">操作</div>
  <div class="user-tags" id="userTags"></div>
  <div class="remark-row">
    <input class="input" id="remarkInput" placeholder="备注名（如 大号）" autocomplete="off">
  </div>

  <div style="display:flex; gap:10px; margin-bottom:20px;">
    <button class="btn btn-primary btn-block" id="btnBackup">存 号</button>
    <button class="btn btn-outline btn-block" id="btnRefresh">刷 新</button>
  </div>

  <div class="divider"></div>

  <div class="section-title">已保存账号</div>
  <div class="backup-list" id="backupList">
    <div class="empty"><span class="empty-icon">. . .</span>加载中</div>
  </div>

  <div class="footer-deco"></div>

</div>

<div class="toast" id="toast"></div>

<script>
var selectedPkg = '';
var selectedUid = '';
var uids = [];

var _isKsu = (typeof ksu !== 'undefined' && ksu && typeof ksu.exec === 'function');

var games = [
  { name:'和平精英', pkg:'com.tencent.tmgp.pubgmhd' },
  { name:'王者荣耀', pkg:'com.tencent.tmgp.sgame' },
  { name:'无畏契约', pkg:'com.tencent.tmgp.codev' },
  { name:'三角洲行动', pkg:'com.tencent.tmgp.dfm' },
  { name:'CF 手游', pkg:'com.tencent.tmgp.cf' },
];

var iconMap = {
  'com.tencent.tmgp.pubgmhd':'&#x1F52B;',
  'com.tencent.tmgp.sgame':'&#x2694;',
  'com.tencent.tmgp.codev':'&#x1F4A3;',
  'com.tencent.tmgp.dfm':'&#x1F3AF;',
  'com.tencent.tmgp.cf':'&#x1F52B;',
};

function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type||'') + ' show';
  clearTimeout(el._timer);
  el._timer = setTimeout(function(){ el.className='toast'; }, 2200);
}

function api(action, params) {
  var qs = '';
  if (params) {
    var pairs = [];
    for (var k in params) {
      if (params.hasOwnProperty(k)) pairs.push(k + '=' + params[k]);
    }
    qs = pairs.join('&');
  }

  if (_isKsu) {
    var query = 'action=' + action;
    if (qs) query += '&' + qs;
    var safe = query.replace(/'/g, "'\\''");
    return ksu.exec("QUERY_STRING='" + safe + "' sh /data/adb/modules/qinghe/web/cgi-bin/api.sh")
      .then(function(r) {
        var out = (typeof r === 'string') ? r : (r.stdout || JSON.stringify(r));
        try { return JSON.parse(out); }
        catch(e) { return {ok:false, error: out}; }
      });
  }

  var url = 'action=' + encodeURIComponent(action);
  if (params) {
    for (var k in params) {
      if (params.hasOwnProperty(k)) url += '&' + k + '=' + encodeURIComponent(params[k]);
    }
  }
  return fetch('/cgi-bin/api.sh?' + url)
    .then(function(r){ return r.json(); })
    .catch(function(e){ return {ok:false,error:'offline'}; });
}

function selectGame(pkg) {
  selectedPkg = pkg;
  document.querySelectorAll('.game-card').forEach(function(c){ c.classList.remove('selected'); });
  var el = document.getElementById('card_' + pkg.replace(/\./g,'_'));
  if (el) el.classList.add('selected');
  document.getElementById('manualPkg').value = pkg;
  loadUids(pkg);
}

document.getElementById('btnManualSelect').addEventListener('click', function(){
  var pkg = document.getElementById('manualPkg').value.trim();
  if (!pkg) return;
  selectedPkg = pkg;
  document.querySelectorAll('.game-card').forEach(function(c){ c.classList.remove('selected'); });
  loadUids(pkg);
});

function renderGames() {
  var grid = document.getElementById('gameGrid');
  grid.innerHTML = '';
  games.forEach(function(g){
    var card = document.createElement('div');
    card.className = 'game-card';
    card.id = 'card_' + g.pkg.replace(/\./g,'_');
    card.innerHTML =
      '<span class="game-icon">'+(iconMap[g.pkg]||'&#x1F3AE;')+'</span>'+
      '<div class="game-name">'+g.name+'</div>'+
      '<div class="game-pkg">'+g.pkg+'</div>';
    card.addEventListener('click', function(){ selectGame(g.pkg); });
    grid.appendChild(card);
  });
}

function loadUids(pkg) {
  var tags = document.getElementById('userTags');
  tags.innerHTML = '<span style="font-size:12px;color:var(--text-light);padding:6px 0;">扫描分区中...</span>';
  api('uids', {pkg:pkg}).then(function(r){
    if (r.ok && r.uids && r.uids.length > 0) {
      uids = r.uids;
      selectedUid = uids[0];
      renderUserTags();
    } else {
      tags.innerHTML = '<span style="font-size:12px;color:#e06060;padding:6px 0;">该游戏未安装或无数据</span>';
      uids = [];
    }
  });
}

function renderUserTags() {
  var tags = document.getElementById('userTags');
  if (uids.length === 0) {
    tags.innerHTML = '<span style="font-size:12px;color:var(--text-light);padding:6px 0;">请先选择游戏</span>';
    return;
  }
  tags.innerHTML = '';
  uids.forEach(function(uid){
    var tag = document.createElement('span');
    tag.className = 'user-tag';
    tag.textContent = 'user / ' + uid;
    if (uid === selectedUid) tag.classList.add('selected');
    tag.addEventListener('click', function(){
      selectedUid = uid;
      renderUserTags();
    });
    tags.appendChild(tag);
  });
}

document.getElementById('btnBackup').addEventListener('click', function(){
  if (!selectedPkg) { toast('请先选择游戏','error'); return; }
  var remark = document.getElementById('remarkInput').value.trim() || '未命名';
  var btn = this;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>备份中';
  api('backup', {pkg:selectedPkg, uid:selectedUid||'0', remark:remark}).then(function(r){
    if (r.ok) {
      toast(remark + ' 备份完成', 'success');
      loadBackupList();
    } else {
      toast('失败: '+(r.error||'未知'), 'error');
    }
  }).finally(function(){
    btn.disabled = false;
    btn.textContent = '存 号';
  });
});

function restoreBackup(uid, name, pkg) {
  api('restore', {pkg:pkg, uid:uid, name:name}).then(function(r){
    if (r.ok) {
      toast(name + ' 恢复完成', 'success');
    } else {
      toast('失败: '+(r.error||'未知'), 'error');
    }
  });
}

document.getElementById('btnRefresh').addEventListener('click', loadBackupList);

function loadBackupList() {
  var list = document.getElementById('backupList');
  list.innerHTML = '<div class="empty"><span class="empty-icon">. . .</span>加载中</div>';
  api('list').then(function(r){
    if (!r.ok || !r.items || r.items.length === 0) {
      list.innerHTML = '<div class="empty"><span class="empty-icon">&#x2764;</span>暂无备份<br><small style="font-size:11px;opacity:.6;">选择游戏后点击存号</small></div>';
      return;
    }
    list.innerHTML = '';
    r.items.forEach(function(it){
      var pkg = it.pkg || it.name.split('_')[0];
      var remark = it.name.slice(pkg.length + 1) || '-';
      var item = document.createElement('div');
      item.className = 'backup-item';
      item.innerHTML =
        '<div class="backup-info">'+
        '<div class="name">'+pkg+'</div>'+
        '<div class="meta">'+remark+' &middot; user/'+it.uid+'</div>'+
        '</div>'+
        '<button class="btn btn-green restore-btn">上 号</button>';
      item.querySelector('.restore-btn').addEventListener('click', function(){
        restoreBackup(it.uid, it.name, pkg);
      });
      list.appendChild(item);
    });
  });
}

renderGames();
loadBackupList();
</script>
</body>
</html>
